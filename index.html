<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vector | GeoJSON Editor</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="description" content="Vector is a simple, free and fast tool for GIS pros to create, edit, and manipulate geospatial vector data in the geoJSON data specification." />
    <meta name="keywords" content="Vector, GeoJSON, GeoJSON data editor, GIS data editor, GIS" />
    <meta name="author" content="Stephen Cline" />
    <meta property="og:title" content="Vector a GIS GeoJSON data editor" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vector">
    <meta property="og:description" content="Vector is a simple, free and fast tool for GIS pros to create, edit, and manipulate geospatial vector data in the geoJSON data specification.">
    <meta property="og:url" content="https://vector.rocks/" />
    <meta property="og:image" content="https://vector.rocks/assets/ogimg.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css">
	<link rel="stylesheet" href="assets/style.css" />
	<link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
<div class="top-bar">
    <img class="logo" src="assets/logo-main.svg">
    <div id="edit-top-box">
        <select id="select-edit" class="input"></select>
        <div id="edit-controls"></div>
    </div>
</div>
<div id="sidebar">
    <div class="wrapper">
        <div class="wrapper-tabs">
            <div>
                <input type="radio" id="tab-layers" name="tabs" checked>
                <label for="tab-layers" class="tab">Layers</label>
            </div>
            <div>
                <input type="radio" id="tab-edit" name="tabs">
                <label for="tab-edit" class="tab">Edit</label>
            </div>
            <div>
                <input type="radio" id="tab-analysis" name="tabs">
                <label for="tab-analysis" class="tab">Tools</label>
            </div>
        </div>
        <div class="wrapper-content">
            <div class="tab-content" id="layer-box">
                <div id="layer-settings-box"></div>
                <div id="layer-list"></div>
            </div>
            <div class="tab-content" id="edit-selection-box"></div>
            <div class="tab-content" id="analysis-box"></div>
        </div>
    </div>
</div>
<div id="map"></div>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.5.1/mapbox-gl-draw.js"></script>
<script src="https://unpkg.com/@turf/turf@7.3.4/turf.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/analysis.js"></script>
</body>
</html>
